services:
  careerx:
    build:
      context: .
      dockerfile: Dockerfile
    image: careerx:latest
    ports:
      - "8000:8000"
    environment:
      # Pick one provider and supply its key.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      ARTIFACT_TTL_SECONDS: ${ARTIFACT_TTL_SECONDS:-1800}
    volumes:
      # Persist Tectonic's package cache across container rebuilds.
      - tectonic-cache:/var/cache/tectonic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  tectonic-cache:
